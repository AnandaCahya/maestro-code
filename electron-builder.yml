appId: com.maestro.code
productName: Mestro Code
copyright: Copyright © 2026 Mestro Studio Contributors

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-Windows-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-macOS-${version}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-Linux-${version}-${arch}.${ext}
  category: Development